  - main [ref=f8e9]:
    - heading "Privacy Notice" [level=1] [ref=f8e10]
    - paragraph [ref=f8e11]:
      - text: "Last updated:"
      - time [ref=f8e12]: 13 October 2026
    - paragraph [ref=f8e13]: This notice explains what personal data KerjaReady collects, how it is used and who can see it. Please read it before you create an account or upload a resume.
    - generic [ref=f8e14]:
      - region [ref=f8e15]:
        - heading "About KerjaReady" [level=2] [ref=f8e16]
        - paragraph [ref=f8e18]: KerjaReady is a prototype career readiness platform for technology students and recruiters in Malaysia. It is developed for academic purposes.
      - region [ref=f8e19]:
        - heading "What We Collect" [level=2] [ref=f8e20]
        - generic [ref=f8e21]:
          - list [ref=f8e22]:
            - listitem [ref=f8e23]:
              - strong [ref=f8e24]: "Account details:"
              - text: your name, email address and account type. Recruiters also provide a company name.
            - listitem [ref=f8e25]:
              - strong [ref=f8e26]: "Password:"
              - text: handled by Amazon Cognito, our sign-in service. KerjaReady never sees or stores it.
            - listitem [ref=f8e27]:
              - strong [ref=f8e28]: "Resumes:"
              - text: the files you upload and the text taken from them.
            - listitem [ref=f8e29]:
              - strong [ref=f8e30]: "Results:"
              - text: assessments, the skills evidenced in your resume with the text that shows them, recommendations, roadmaps and match scores.
            - listitem [ref=f8e31]:
              - strong [ref=f8e32]: "Applications:"
              - text: the listings you apply to, their status and any reason a recruiter gives for a decision.
            - listitem [ref=f8e33]:
              - strong [ref=f8e34]: "Job listings:"
              - text: the listings recruiters post.
          - paragraph [ref=f8e35]: Do not include details a job application does not need, such as your MyKad number, in your resume.
      - region [ref=f8e36]:
        - heading "How We Use Your Data" [level=2] [ref=f8e37]
        - generic [ref=f8e38]:
          - list [ref=f8e39]:
            - listitem [ref=f8e40]: To assess your resume against the role you choose.
            - listitem [ref=f8e41]: To show which skills required by that role are evidenced in your resume.
            - listitem [ref=f8e42]: To generate resume recommendations and a learning roadmap.
            - listitem [ref=f8e43]: To calculate match scores between your resume and job listings.
            - listitem [ref=f8e44]: To let you apply to listings and see the outcome.
          - paragraph [ref=f8e45]: Some features use AI. Your resume text is processed by Amazon Bedrock to generate recommendations and roadmaps. Your resume is not used to train KerjaReady's assessment model, and Amazon Bedrock does not use it to train its models.
          - paragraph [ref=f8e46]: We do not sell your data or use it for advertising.
      - region [ref=f8e47]:
        - heading "Who Can See Your Data" [level=2] [ref=f8e48]
        - list [ref=f8e50]:
          - listitem [ref=f8e51]: You can see all of your own data.
          - listitem [ref=f8e52]: A recruiter can see your resume, match score and skill evidence only after you apply to one of their listings, and only for that listing.
          - listitem [ref=f8e53]: Recruiters see only the applications made to their own listings.
          - listitem [ref=f8e54]: Amazon Web Services (AWS) hosts and processes the data on our behalf. It does not use the data for its own purposes.
      - region [ref=f8e55]:
        - heading "Where Your Data Is Stored" [level=2] [ref=f8e56]
        - list [ref=f8e58]:
          - listitem [ref=f8e59]: Your data is stored on AWS in the Asia Pacific (Malaysia) region.
          - listitem [ref=f8e60]: Some AI processing may take place in AWS regions outside Malaysia.
          - listitem [ref=f8e61]: Stored files and records are encrypted, and all connections use HTTPS.
          - listitem [ref=f8e62]: You must sign in to reach your data, and each account can reach only its own.
      - region [ref=f8e63]:
        - heading "How Long We Keep Your Data" [level=2] [ref=f8e64]
        - paragraph [ref=f8e66]: We keep your data while your account is active. You can ask us to delete your account at any time. All data will be deleted when the KerjaReady prototype is taken offline.
      - region [ref=f8e67]:
        - heading "Your Choices and Rights" [level=2] [ref=f8e68]
        - generic [ref=f8e69]:
          - paragraph [ref=f8e70]: "You can ask us to:"
          - list [ref=f8e71]:
            - listitem [ref=f8e72]: Give you a copy of your personal data.
            - listitem [ref=f8e73]: Correct personal data that is wrong.
            - listitem [ref=f8e74]: Delete your account, resumes and results.
            - listitem [ref=f8e75]: Stop processing your data. Withdrawing consent means we can no longer provide the service, so your account will be deleted.
      - region [ref=f8e76]:
        - heading "About Your Results" [level=2] [ref=f8e77]
        - generic [ref=f8e78]:
          - paragraph [ref=f8e79]: Assessments, skill gap analyses and match scores are produced automatically from the text of your resume. They show what your resume evidences, not your actual ability. A skill marked “not evidenced in the resume” may still be a skill you have.
          - paragraph [ref=f8e80]: Recruiters make their own decisions. KerjaReady does not accept or reject applications.
      - region [ref=f8e81]:
        - heading "Contact Us" [level=2] [ref=f8e82]
        - paragraph [ref=f8e84]:
          - text: For questions about this notice or your data, email
          - link "[CONTACT EMAIL]" [ref=f8e85] [cursor=pointer]:
            - /url: mailto:[CONTACT EMAIL]
          - text: . If we change this notice, we will update the date at the top of this page.